name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  ci:
    name: Build, Test and Docker
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'ga'

      - name: Environment info
        run: dotnet --info

      - name: Restore
        run: dotnet restore FiapX.VideoManagementService.sln --configfile NuGet.Config

      - name: Build
        run: dotnet build FiapX.VideoManagementService.sln --configuration Release --no-restore

      - name: Test
        id: tests
        run: dotnet test FiapX.VideoManagementService.sln --configuration Release --no-build --logger "trx;LogFilePrefix=test-results" --results-directory TestResults

      - name: Upload test results
        if: ${{ always() && steps.tests.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: TestResults/**/*.trx
          retention-days: 7
          if-no-files-found: error

      - name: Docker environment info
        run: |
          docker version
          docker info --format 'ServerVersion={{.ServerVersion}}; OSType={{.OSType}}; Architecture={{.Architecture}}; OperatingSystem={{.OperatingSystem}}'

      - name: Docker build
        run: docker build --file src/FiapX.VideoManagement.Api/Dockerfile --tag fiapx-video-management:ci .

  publish-image:
    name: Publish Docker Image
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    if: ${{ needs.ci.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./src/FiapX.VideoManagement.Api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Publish summary
        run: |
          {
            echo "### Published Docker image"
            echo ""
            echo "Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
            echo "SHA: ${{ github.sha }}"
            echo "Digest: ${{ steps.push.outputs.digest }}"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy Management
    needs: publish-image
    runs-on: [self-hosted, Windows, X64, fiap-fase5]
    timeout-minutes: 30
    if: ${{ needs.publish-image.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
    env:
      DEPLOY_INFRA_PATH: ${{ vars.DEPLOY_INFRA_PATH }}
      DEPLOY_IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Runner environment info
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $PSVersionTable
          docker version
          docker compose version
          docker ps

      - name: Deploy Management
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: .\.github\scripts\deploy-management.ps1
