name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Build, Test and Docker
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'ga'

      - name: Environment info
        run: dotnet --info

      - name: Restore
        run: dotnet restore FiapX.VideoManagementService.sln --configfile NuGet.Config

      - name: Build
        run: dotnet build FiapX.VideoManagementService.sln --configuration Release --no-restore

      - name: Test
        id: tests
        run: dotnet test FiapX.VideoManagementService.sln --configuration Release --no-build --logger "trx;LogFilePrefix=test-results" --results-directory TestResults

      - name: Upload test results
        if: ${{ always() && steps.tests.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: TestResults/**/*.trx
          retention-days: 7
          if-no-files-found: error

      - name: Docker environment info
        run: |
          docker version
          docker info --format 'ServerVersion={{.ServerVersion}}; OSType={{.OSType}}; Architecture={{.Architecture}}; OperatingSystem={{.OperatingSystem}}'

      - name: Docker build
        run: docker build --file src/FiapX.VideoManagement.Api/Dockerfile --tag fiapx-video-management:ci .
